<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ChatSim</title>
    <meta name="description" content="Multi-character conversational simulation and roleplay chat app." />
    <meta property="og:title" content="ChatSim" />
    <meta property="og:description" content="Multi-character conversational simulation and roleplay chat app." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'%3E%3Cpath fill='%23e8a04a' d='M12 1.6C16.6 8 21 13 21 19.6a9 9 0 01-18 0C3 13 7.4 8 12 1.6z'/%3E%3C/svg%3E"
    />
    <script>
      // 在 React 載入前先套用主題，避免閃一下白畫面
      try {
        var s = JSON.parse(localStorage.getItem('chatsim2.settings') || '{}')
        var t = s.theme || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
